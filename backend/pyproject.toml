[project]
name = "undo-core"
version = "1.0.0"
description = "Undo backend: content-addressed file version history, filesystem monitoring daemon and local API."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "watchdog>=4.0",
    "blake3>=0.4",
    "zstandard>=0.22",
    "httpx>=0.27",
]

[project.optional-dependencies]
windows-service = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
undo-daemon = "undo_core.daemon.manager:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undo_core"]
