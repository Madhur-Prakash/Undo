[project]
name = "undo-cli"
version = "1.0.0"
description = "Undo command line interface and Textual terminal dashboard."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "undo-core",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.70",
    "httpx>=0.27",
]

[project.scripts]
undo = "undo_cli.main:run"

[tool.uv.sources]
undo-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["undo_cli"]
