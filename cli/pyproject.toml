[project]
name = "undo-cli"
version = "1.1.0"
description = "Undo command line interface and Textual terminal dashboard."
license = { text = "MIT" }
authors = [{ name = "Madhur Prakash Mangal" }]
requires-python = ">=3.12"
dependencies = [
    "undo-core",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.70",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Madhur-Prakash/Undo"
Documentation = "https://github.com/Madhur-Prakash/Undo/tree/main/docs"
Changelog = "https://github.com/Madhur-Prakash/Undo/blob/main/CHANGELOG.md"
Issues = "https://github.com/Madhur-Prakash/Undo/issues"

[project.scripts]
undo = "undo_cli.main:run"

[tool.uv.sources]
undo-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["undo_cli"]
